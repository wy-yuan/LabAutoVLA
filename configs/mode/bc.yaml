# Behavior Cloning training mode.
name: bc

device: "cuda:0" 
steps: 20000
batch_size: 12
num_workers: 4
validation_fraction: 0.1
split_seed: 42

# Checkpointing / evaluation cadence, in optimizer steps.
ckpt_every: 5000
val_every: 1000
eval_every: 5000

# Online sim evaluation — set false to skip spinning up Isaac Lab.
sim_eval: false
eval:
  n_episodes: 1
  max_steps: 500
  use_async_envs: false

optim:
  lr: 1.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.95]
  grad_clip: 1.0

scheduler: cosine
scheduler_warmup_steps: 1000

# Experiment tracking
use_wandb: false
wandb_project: labauto-vla
run_name: null               # null -> wandb autogenerates
