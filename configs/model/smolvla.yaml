# SmolVLA (LeRobot) wrapper config.
# The `name` key selects the registered class in vla/models/registry.py.
# Everything under `kwargs` is forwarded to the wrapper's __init__.
name: smolvla

kwargs:
  # 9D task checkpoint used to initialize 24D training. For evaluation, override
  # this with the new 24D checkpoint produced by the training run.
  pretrained_name_or_path: lerobot/smolvla_base
  chunk_size: 100             # null -> use SmolVLA default
  n_action_steps: 10
  use_rotation_6d: true      # raw data/env use xyz+quat(+gripper); model learns xyz+rot6(+gripper)
  use_relative_actions: true
  step0_loss_weight: 3.0   # extra weight on step-0; 1.0 = disabled
  gripper_loss_weight: 1.0 # extra weight on gripper action dims; 1.0 = disabled
  freeze_vision_encoder: false
  train_expert_only: false
  load_pretrained: true
  load_vlm_weights: true
  device: "cuda:0" 
