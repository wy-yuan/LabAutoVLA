# =============================================================================
# LabAutoVLA — top-level Hydra config
# -----------------------------------------------------------------------------
# Run BC:        python scripts/train.py mode=bc model=smolvla task=pipetting
# Run RL:        python scripts/train.py mode=rl model=smolvla task=pipetting
# Swap model:    python scripts/train.py model=openvla     (needs the stub filled in)
# Override LR:   python scripts/train.py mode.optim.lr=5e-5
# =============================================================================

defaults:
  - mode: bc                 # {bc, rl}
  - model: smolvla           # {smolvla, openvla, ...}
  - task: pipetting          # {pipetting, ...}
  - _self_

# Default dataset location for pipetting training.
dataset:
  src_hdf5: data/datasets/hdf5/pipetting_v6_action_hold05_ep200/pipetting.hdf5
  root: data/datasets/pipetting_v6_action_hold05_ep200
  repo_id: local/pipetting_v6_action_hold05_ep200
  fps: 60
  action_chunk_size: 100

# Where every output (ckpts, videos, TB logs) lands for this run.
output_dir: outputs/${now:%Y%m%d_%H%M%S}_${model.name}_${mode.name}_${task.workflow.name}

hydra:
  run:
    dir: ${output_dir}
  job:
    chdir: false             # keep cwd = repo root so relative paths work
